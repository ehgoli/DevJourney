<!DOCTYPE html>
<html dir="rtl" lang="fa">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <meta name="description" content="صفحه مورد نظر پیدا نشد. به صفحه اصلی سایت شخصی احسان گلی بازگردید.">

        <title>
            صفحه پیدا نشد | سایت شخصی احسان گلی
        </title>

        <!-- Set theme (light/dark) early, right before the first stylesheet -->
        <script src="assets/js/theme-init.js"></script>

        <!-- Bootstrap RTL -->
        <link href="assets/vendor/bootstrap/css/bootstrap.rtl.css" rel="stylesheet">

        <!-- Bootstrap icons -->
        <link href="assets/vendor/bootstrap/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

        <!-- Layout: variables, base reset, container, shared header & footer -->
        <link href="assets/css/layout.css" rel="stylesheet">

        <!-- Import Fonts -->
        <link href="assets/fonts/style.css" rel="stylesheet">

        <!-- Error page styles (shared with other error pages) -->
        <link href="assets/css/error-page.css" rel="stylesheet">
        <!-- Dark Mode: color variable overrides for dark theme (data-bs-theme="dark") — must always be the last CSS file loaded -->
        <link href="assets/css/dark-mode.css" rel="stylesheet">
    </head>
    <body>

        <!--
            ======================================================
            THEME TOGGLE (light/dark)
            Fixed floating button, identical on every page.
            ======================================================
        -->
        <button aria-label="تغییر پوسته تاریک/روشن" aria-pressed="false" class="theme-toggle-btn" id="themeToggleBtn" title="تغییر پوسته تاریک/روشن" type="button">
            <i class="bi bi-moon-stars theme-toggle-icon-dark"></i>
            <i class="bi bi-sun theme-toggle-icon-light"></i>
        </button>
        

        <!-- MAIN CONTENT -->
        <main>
            <section class="error-page-section">
                <div class="container">
                    <div class="error-page-content">

                        <div class="error-illustration">
                            <svg role="img" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
                                <title>
                                    خروجی ترمینال: HTTP 404 Not Found
                                </title>
                                <rect fill="#2f3439" height="284" rx="14" width="464" x="8" y="8"></rect>
                                <circle cx="34" cy="34" fill="#e5e7eb" opacity="0.3" r="5"></circle>
                                <circle cx="52" cy="34" fill="#e5e7eb" opacity="0.3" r="5"></circle>
                                <circle cx="70" cy="34" fill="#e5e7eb" opacity="0.3" r="5"></circle>
                                <line stroke="#454b52" stroke-width="1" x1="8" x2="472" y1="58" y2="58"></line>
                                <text fill="#9ca3af" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" x="34" y="92">$ curl -i https://ehsangoli.dev/some-page</text>
                                <text fill="#f87171" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" font-weight="700" x="34" y="132">HTTP/1.1 404 Not Found</text>
                                <text fill="#6b7280" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" x="34" y="156">Content-Type: application/json</text>
                                <text fill="#e5e7eb" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13.5" x="34" y="192">{</text>
                                <text fill="#e5e7eb" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13.5" x="52" y="216"><tspan fill="#93c5fd">"status"</tspan>: <tspan fill="#fbbf24">404</tspan>,</text>
                                <text fill="#e5e7eb" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13.5" x="52" y="240"><tspan fill="#93c5fd">"error"</tspan>: <tspan fill="#86efac">"Not Found"</tspan></text>
                                <text fill="#e5e7eb" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13.5" x="34" y="264">}</text>
                            </svg>
                        </div>

                        <span class="error-eyebrow">
                            خطای ۴۰۴
                        </span>

                        <h1 class="error-title">
                            صفحه‌ای که دنبالش بودی پیدا نشد
                        </h1>

                        <p class="error-description">
                            آدرسی که وارد کردی وجود نداره یا جابه‌جا شده. می‌تونی از دکمه‌ی زیر به صفحه اصلی
                            برگردی یا از لینک‌های زیرش مستقیم به بخش موردنظرت بری.
                        </p>

                        <div class="error-actions">
                            <a class="error-primary-btn" href="Resume.html">
                                <i class="bi bi-house-door"></i>
                                بازگشت به صفحه اصلی
                            </a>
                        </div>

                        <nav aria-label="لینک‌های پیشنهادی" class="error-links">
                            <a href="Resume.html#projects">
                                نمونه‌کارها
                            </a>
                            <span class="error-links-sep">
                                ·
                            </span>
                            <a href="Resume.html#articles">
                                مقالات
                            </a>
                            <span class="error-links-sep">
                                ·
                            </span>
                            <a href="articles-ajax.html">
                                آرشیو مقالات
                            </a>
                            <span class="error-links-sep">
                                ·
                            </span>
                            <a href="Resume.html#contact">
                                تماس با من
                            </a>
                        </nav>

                    </div>
                </div>
            </section>
        </main>

        
        <!-- Scripts -->
        <script src="assets/vendor/bootstrap/js/bootstrap.bundle.js"></script>
        <script src="assets/js/theme-toggle.js"></script>
    </body>
</html>
